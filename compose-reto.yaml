services:
  postgres-reto:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: academico
      POSTGRES_USER: academico
      POSTGRES_PASSWORD: academico
    ports:
      - "5433:5432"
    volumes:
      - datos_academicos_reto:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academico"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  datos_academicos_reto: